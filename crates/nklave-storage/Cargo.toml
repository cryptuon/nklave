[package]
name = "nklave-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistence layer for Nklave (append-only logs, checkpoints, EIP-3076)"

[dependencies]
nklave-core = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }

# Hashing and crypto
sha2 = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
rand = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Async runtime (for checkpoint scheduler)
tokio = { workspace = true, features = ["time", "sync", "rt"] }

[dev-dependencies]
tempfile = { workspace = true }
