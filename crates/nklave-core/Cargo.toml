[package]
name = "nklave-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Core signing logic, BLS/Ed25519 keys, and slashing protection rules for Nklave"

[features]
default = []
# AWS KMS key provider support
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms"]
# HashiCorp Vault key provider support
vault = []

[dependencies]
# BLS cryptography (Ethereum)
blst = { workspace = true }

# Ed25519 cryptography (Cosmos)
ed25519-dalek = { workspace = true }
rand = { workspace = true }

# Hashing and crypto
sha2 = { workspace = true }
hex = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
scrypt = { workspace = true }
pbkdf2 = { workspace = true }
hmac = { workspace = true }
uuid = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }

# Async runtime (for replication)
tokio = { workspace = true }
async-trait = { workspace = true }

# TLS for replication
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }

# AWS KMS (optional)
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "signing"
harness = false
