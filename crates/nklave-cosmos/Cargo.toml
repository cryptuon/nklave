[package]
name = "nklave-cosmos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cosmos/CometBFT remote signer protocol handler for Nklave"

[dependencies]
# Internal crates
nklave-core = { path = "../nklave-core" }

# Tendermint protobuf types
tendermint-proto = "0.39"
tendermint = "0.39"

# gRPC
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Hashing
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = "0.4"
