[package]
name = "nklave-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Main server binary for Nklave with TLS, metrics, and configuration"

[[bin]]
name = "nklave"
path = "src/main.rs"

[[bin]]
name = "generate-test-keys"
path = "src/bin/generate_test_keys.rs"

[[bin]]
name = "slashing-protection"
path = "src/bin/slashing_protection.rs"

[dependencies]
nklave-core = { workspace = true }
nklave-api = { workspace = true }
nklave-storage = { workspace = true }

# Async runtime
tokio = { workspace = true }

# HTTP framework
axum = { workspace = true }
axum-server = { workspace = true }
rustls-pemfile = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }

# Crypto (for key generation)
sha2 = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
scrypt = { workspace = true }
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging/metrics
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
