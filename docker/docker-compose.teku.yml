# Nklave + Teku Integration Testing
# Extends the base docker-compose.yml

version: '3.8'

services:
  nklave:
    extends:
      file: docker-compose.yml
      service: nklave

  # Mock beacon node for testing
  beacon-mock:
    build:
      context: ../tests/mocks/beacon-mock
      dockerfile: Dockerfile
    container_name: beacon-mock
    ports:
      - "5052:5052"
    networks:
      - nklave-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5052/eth/v1/beacon/genesis"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Teku validator client
  teku-vc:
    image: consensys/teku:${TEKU_VERSION:-latest}
    container_name: teku-vc
    command: |
      validator-client
        --network=holesky
        --beacon-node-api-endpoint=http://beacon-mock:5052
        --validators-external-signer-url=http://nklave:9000
        --validators-external-signer-public-keys=${VALIDATOR_PUBKEYS:-}
        --validators-external-signer-slashing-protection-enabled=false
        --data-path=/data
    volumes:
      - teku-data:/data
    depends_on:
      nklave:
        condition: service_healthy
      beacon-mock:
        condition: service_healthy
    networks:
      - nklave-net
    restart: unless-stopped

volumes:
  nklave-keys:
  nklave-data:
  teku-data:

networks:
  nklave-net:
