[workspace]
resolver = "2"
members = [
    "crates/nklave-core",
    "crates/nklave-api",
    "crates/nklave-storage",
    "crates/nklave-server",
    "crates/nklave-cosmos",
    "crates/nklave-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cryptuon/nklave"
homepage = "https://nklave.cryptuon.com/"
documentation = "https://docs.cryptuon.com/nklave"
authors = ["Cryptuon Research <contact@cryptuon.com>"]
keywords = ["ethereum", "validator", "signing", "slashing-protection", "web3signer"]
categories = ["cryptography", "authentication"]

[workspace.dependencies]
# Internal crates
nklave-core = { version = "0.1.0", path = "crates/nklave-core" }
nklave-api = { version = "0.1.0", path = "crates/nklave-api" }
nklave-storage = { version = "0.1.0", path = "crates/nklave-storage" }
nklave-cosmos = { version = "0.1.0", path = "crates/nklave-cosmos" }
nklave-cli = { version = "0.1.0", path = "crates/nklave-cli" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }

# TLS
rustls-pemfile = "2"
tokio-rustls = "0.26"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# BLS cryptography (Ethereum)
blst = "0.3"

# Ed25519 cryptography (Cosmos)
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

# Hashing and crypto
sha2 = "0.10"
hex = "0.4"
aes = "0.8"
ctr = "0.9"
scrypt = "0.11"
pbkdf2 = { version = "0.12", features = ["hmac"] }
hmac = "0.12"
uuid = { version = "1", features = ["serde", "v4"] }

# Storage
bincode = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging/metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Configuration
toml = "0.8"

# Testing
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# Async
async-trait = "0.1"

# AWS SDK (for KMS key provider)
aws-config = "1.1"
aws-sdk-kms = "1.15"

# UI embedding
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

[profile.release]
lto = true
codegen-units = 1
