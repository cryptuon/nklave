[workspace]
resolver = "2"
members = [
    "crates/nklave-core",
    "crates/nklave-api",
    "crates/nklave-storage",
    "crates/nklave-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nklave/nklave"
authors = ["Nklave Team"]

[workspace.dependencies]
# Internal crates
nklave-core = { path = "crates/nklave-core" }
nklave-api = { path = "crates/nklave-api" }
nklave-storage = { path = "crates/nklave-storage" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }

# TLS
rustls-pemfile = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# BLS cryptography
blst = "0.3"

# Hashing and crypto
sha2 = "0.10"
hex = "0.4"
aes = "0.8"
ctr = "0.9"
scrypt = "0.11"
pbkdf2 = { version = "0.12", features = ["hmac"] }
hmac = "0.12"
uuid = { version = "1", features = ["serde", "v4"] }

# Storage
bincode = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging/metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Configuration
toml = "0.8"

# Testing
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
