apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nklave.configMapName" . }}
  labels:
    {{- include "nklave.labels" . | nindent 4 }}
data:
  config.toml: |
    # Nklave Configuration
    # Generated by Helm chart

    [server]
    listen_addr = "{{ .Values.config.server.listenAddr }}"
    metrics_addr = "{{ .Values.config.server.metricsAddr }}"
    checkpoint_interval_secs = {{ .Values.config.server.checkpointIntervalSecs }}
    checkpoint_backup_count = {{ .Values.config.server.checkpointBackupCount }}

    [api]
    request_timeout_secs = {{ .Values.config.api.requestTimeoutSecs }}
    max_concurrent_requests = {{ .Values.config.api.maxConcurrentRequests }}
    max_body_size = {{ .Values.config.api.maxBodySize }}

    [auth]
    mode = "{{ .Values.config.auth.mode }}"

    [logging]
    encrypt = {{ .Values.config.logging.encrypt }}

    [logging.rotation]
    max_size_mb = {{ .Values.config.logging.rotation.maxSizeMb }}
    max_files = {{ .Values.config.logging.rotation.maxFiles }}
    compress = {{ .Values.config.logging.rotation.compress }}

    [security]
    key_provider = "{{ .Values.config.security.keyProvider }}"

    {{- if .Values.tls.enabled }}
    [tls]
    enabled = true
    cert_path = "{{ .Values.tls.certPath }}"
    key_path = "{{ .Values.tls.keyPath }}"
    {{- end }}

    {{- if .Values.replication.enabled }}
    [replication]
    enabled = true
    role = "{{ .Values.replication.role }}"
    listen_addr = "{{ .Values.replication.listenAddr }}"
    heartbeat_interval_ms = {{ .Values.replication.heartbeatIntervalMs }}
    max_buffer_size = {{ .Values.replication.maxBufferSize }}

    {{- if .Values.replication.tls.enabled }}
    [replication.tls]
    enabled = true
    cert_path = "{{ .Values.replication.tls.certPath }}"
    key_path = "{{ .Values.replication.tls.keyPath }}"
    ca_cert_path = "{{ .Values.replication.tls.caCertPath }}"
    {{- end }}
    {{- end }}
